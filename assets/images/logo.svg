<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="100%" height="100%">
  <defs>
    <!-- Emerald Gradient -->
    <linearGradient id="logo-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Dark Gradient for Icon Base -->
    <linearGradient id="logo-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6)">
    <!-- Base Squircle -->
    <rect width="84" height="84" rx="22" fill="url(#logo-dark)"/>
    <rect width="82" height="82" x="1" y="1" rx="21" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Scaled Core Geometric Symbol -->
    <g transform="translate(42, 42) scale(0.24)">
      <!-- Outer Frame -->
      <path d="M -85,-110 L 85,-110 C 120,-110 135,-85 135,-50 L 135,30 C 135,65 120,85 85,85 L -85,85 C -120,85 -135,65 -135,30 L -135,-50 C -135,-85 -120,-110 -85,-110 Z" 
            fill="none" 
            stroke="url(#logo-emerald)" 
            stroke-width="26" 
            stroke-linejoin="round"/>

      <!-- Barcode Bars -->
      <rect x="-60" y="-55" width="16" height="85" rx="8" fill="url(#logo-emerald)"/>
      <rect x="-18" y="-45" width="22" height="75" rx="10" fill="#f8fafc"/>
      <rect x="28" y="-55" width="14" height="85" rx="7" fill="url(#logo-emerald)"/>
      <rect x="58" y="-40" width="18" height="60" rx="8" fill="#e2e8f0"/>

      <!-- Scanner Beam -->
      <line x1="-135" y1="-5" x2="135" y2="-5" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-5" r="7" fill="#ffffff"/>

      <!-- Pedestal Base -->
      <path d="M -55,120 L 55,120 L 75,150 L -75,150 Z" fill="#334155"/>
      <rect x="-85" y="150" width="170" height="14" rx="7" fill="url(#logo-emerald)"/>
    </g>
  </g>

  <!-- Typography: OMNI POS -->
  <g transform="translate(108, 0)">
    <!-- Main Title -->
    <text x="0" y="52" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="-1" fill="#0f172a">
      OMNI<tspan fill="#059669">POS</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="73" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="3.5" fill="#64748b" text-transform="uppercase">
      UNIVERSAL RETAIL CLOUD
    </text>
  </g>
</svg>
